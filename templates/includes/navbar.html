{% load static %}
<!-- TopNavBar -->
<nav class="fixed top-0 w-full z-50 border-b border-white/10 bg-surface/10 backdrop-blur-xl shadow-2xl shadow-black/20">
    <div class="flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 max-w-container-max mx-auto">
        <a href="{% url 'home' %}" class="font-display-xl text-headline-lg-mobile md:text-headline-lg font-black tracking-tighter text-on-surface">KONKAN</a>
        <div class="hidden md:flex items-center gap-8">
            <a class="{% if request.resolver_match.url_name == 'home' %}text-ocean-cyan border-b-2 border-ocean-cyan pb-1{% else %}text-on-surface-variant hover:text-on-surface transition-colors duration-300{% endif %} font-eyebrow text-eyebrow uppercase tracking-widest" href="{% url 'home' %}">Discover</a>
            <a class="{% if request.resolver_match.url_name == 'destination_list' %}text-ocean-cyan border-b-2 border-ocean-cyan pb-1{% else %}text-on-surface-variant hover:text-on-surface transition-colors duration-300{% endif %} font-eyebrow text-eyebrow uppercase tracking-widest" href="{% url 'destination_list' %}">Destinations</a>
            <a class="{% if request.resolver_match.url_name == 'temples' %}text-ocean-cyan border-b-2 border-ocean-cyan pb-1{% else %}text-on-surface-variant hover:text-on-surface transition-colors duration-300{% endif %} font-eyebrow text-eyebrow uppercase tracking-widest" href="{% url 'temples' %}">Culture</a>
            <a class="{% if request.resolver_match.url_name == 'food_home' %}text-ocean-cyan border-b-2 border-ocean-cyan pb-1{% else %}text-on-surface-variant hover:text-on-surface transition-colors duration-300{% endif %} font-eyebrow text-eyebrow uppercase tracking-widest" href="{% url 'food_home' %}">Food</a>
        </div>
        <div class="flex items-center gap-4">
            {% if user.is_authenticated %}
                <a href="{% url 'my_profile' %}" class="hidden md:flex items-center gap-2 text-on-surface-variant hover:text-ocean-cyan transition-all" title="Profile">
                    <span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
                </a>
                <form action="{% url 'logout' %}" method="post" class="m-0 hidden md:flex items-center gap-2 text-on-surface-variant hover:text-ocean-cyan transition-all cursor-pointer">
                    {% csrf_token %}
                    <button type="submit" class="flex" title="Logout"><span class="material-symbols-outlined" data-icon="logout">logout</span></button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="hidden md:flex items-center gap-2 text-on-surface-variant hover:text-ocean-cyan transition-all" title="Login">
                    <span class="material-symbols-outlined" data-icon="login">login</span>
                </a>
            {% endif %}
            <a href="{% url 'home_spots' %}" class="bg-ocean-cyan text-on-primary px-6 py-2 rounded-full font-eyebrow text-eyebrow uppercase tracking-widest hover:scale-105 active:scale-95 transition-all">Plan Trip</a>
        </div>
    </div>
</nav>

<!-- BottomNavBar (Mobile Only) -->
<nav class="fixed bottom-0 w-full z-50 md:hidden bg-surface-container-low/80 backdrop-blur-2xl border-t border-white/10 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
    <div class="flex justify-around items-center px-4 pb-6 pt-2">
        <a href="{% url 'home' %}" class="flex flex-col items-center justify-center text-on-surface-variant p-2 {% if request.resolver_match.url_name == 'home' %}text-ocean-cyan{% endif %}">
            <span class="material-symbols-outlined" data-icon="explore">explore</span>
            <span class="font-eyebrow text-[10px] mt-1">Home</span>
        </a>
        <a href="{% url 'destination_list' %}" class="flex flex-col items-center justify-center text-ocean-cyan bg-white/5 rounded-xl p-2 active:-translate-y-1 transition-transform duration-300">
            <span class="material-symbols-outlined" data-icon="map" data-weight="fill">map</span>
            <span class="font-eyebrow text-[10px] mt-1">Explore</span>
        </a>
        <a href="{% url 'home_spots' %}" class="flex flex-col items-center justify-center text-on-surface-variant p-2">
            <span class="material-symbols-outlined" data-icon="bookmark">bookmark</span>
            <span class="font-eyebrow text-[10px] mt-1">Saved</span>
        </a>
        <a href="{% if user.is_authenticated %}{% url 'my_profile' %}{% else %}{% url 'login' %}{% endif %}" class="flex flex-col items-center justify-center text-on-surface-variant p-2">
            <span class="material-symbols-outlined" data-icon="person">person</span>
            <span class="font-eyebrow text-[10px] mt-1">Profile</span>
        </a>
    </div>
</nav>
