{% load static %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<link rel="stylesheet" href="{% static 'css/main.css' %}">
<!-- Navbar Start -->
<!-- Navbar Start -->
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm" style="padding-top:40px;  font-size:1.5rem;">
  <div class="container">
    <!-- Brand -->
    <a class="navbar-brand fw-bold text-primary" href="#">
      Konkan Guide
    </a>

    <!-- Mobile toggle -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Nav links -->
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav mb-2 mb-lg-0 align-items-lg-center">
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'destination_list' %}active{% endif %}" href="{% url 'destination_list' %}">Destinations</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'home_spots' %}active{% endif %}" href="{% url 'home_spots' %}">Spots</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'food_home' %}active{% endif %}" href="{% url 'food_home' %}">Food</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'temples' %}active{% endif %}" href="{% url 'temples' %}">Temples</a>
        </li>

        {% if user.is_authenticated %}
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'home_users' %}active{% endif %}" href="{% url 'home_users' %}">Users</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Add
          </a>
          <ul class="dropdown-menu shadow-sm" aria-labelledby="navbarDropdown">
            <li><a class="dropdown-item" href="{% url 'create_destination' %}">Destination</a></li>
            <li><a class="dropdown-item" href="{% url 'create_spot' %}">Spot</a></li>
            <li><a class="dropdown-item" href="{% url 'create_food' %}">Food</a></li>
          </ul>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'my_profile' %}active{% endif %}" href="{% url 'my_profile' %}">Profile</a>
        </li>
        <li class="nav-item">
          <form method="post" action="{% url 'logout' %}" class="d-inline m-0 p-0">
            {% csrf_token %}
            <button type="submit" class="nav-link border-0 bg-transparent text-start" style="width: 100%;">Logout</button>
          </form>
        </li>
        {% else %}
        <li class="nav-item">
          <a class="nav-link" href="{% url 'login' %}">Login</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'register' %}">Register</a>
        </li>
        {% endif %}
      </ul>
      <form class="d-flex ms-lg-3 mt-3 mt-lg-0" action="{% url 'search' %}" method="get">
        <input class="form-control me-2" type="search" placeholder="Search..." aria-label="Search" name="q" required>
        <button class="btn btn-outline-primary" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>
<!-- Navbar End -->

<!-- Navbar End -->
