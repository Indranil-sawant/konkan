{% extends "base.html" %}

{% block content %} 
<!-- Premium Header Section -->
<div class="relative bg-navy-dark pt-32 pb-32 overflow-hidden min-h-[60vh] flex items-center">
    <div class="absolute inset-0 z-0">
        <div class="absolute top-0 right-0 w-[800px] h-[800px] bg-red-500/20 rounded-full blur-[120px] -translate-y-1/2 translate-x-1/3"></div>
        <div class="absolute bottom-0 left-0 w-[600px] h-[600px] bg-ocean-light/10 rounded-full blur-[100px] translate-y-1/2 -translate-x-1/4"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-navy-dark"></div>
    </div>

    <div class="container mx-auto px-6 lg:px-10 relative z-10 w-full max-w-2xl">
        <div class="bg-white rounded-[2rem] p-8 md:p-12 shadow-[0_20px_40px_rgb(0,0,0,0.2)] text-center relative overflow-hidden">
            <!-- Warning indicator -->
            <div class="absolute top-0 left-0 right-0 h-2 bg-red-500"></div>
            
            <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6 text-red-500 text-4xl">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            
            <h2 class="text-3xl md:text-4xl font-black text-navy-dark tracking-tight mb-4">
                Delete Item
            </h2>
            
            <p class="text-xl text-slate-600 font-medium mb-10 leading-relaxed">
                Are you sure you want to permanently delete <br>
                <strong class="text-navy-dark">"{{ item.name }}"</strong>? <br>
                <span class="text-sm text-slate-400 mt-2 block">This action cannot be undone.</span>
            </p>
            
            <form action="" method="POST" class="flex flex-col sm:flex-row gap-4 justify-center">
                {% csrf_token %}
                <a href="{% url 'home' %}" class="px-8 py-4 bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-xl font-bold transition-colors border border-slate-200">
                    Cancel & Keep It
                </a>
                <button type="submit" class="px-8 py-4 bg-red-500 hover:bg-red-600 text-white rounded-xl font-bold shadow-lg shadow-red-500/30 transition-colors">
                    Yes, Delete Item
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
