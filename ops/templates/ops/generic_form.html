{% extends 'ops/base_ops.html' %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    
    <div>
        <a href="{{ back_url|default:'/ops/content/' }}" class="text-xs font-bold text-sky-600 hover:underline flex items-center gap-1 mb-1">
            <i class="fas fa-arrow-left text-[10px]"></i> Back
        </a>
        <h1 class="font-display font-black text-2xl text-slate-900 tracking-tight">{{ page_title }}</h1>
    </div>

    <div class="bg-white rounded-3xl border border-slate-200 shadow-xs p-6 md:p-8">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">{{ field.label }} {% if field.field.required %}*{% endif %}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <span class="text-[10px] text-slate-400 mt-1 block">{{ field.help_text }}</span>
                    {% endif %}
                    {% if field.errors %}
                        <span class="text-xs text-rose-500 mt-0.5 block">{{ field.errors.0 }}</span>
                    {% endif %}
                </div>
            {% endfor %}

            <div class="pt-6 border-t border-slate-200 flex items-center justify-between">
                <a href="{{ back_url|default:'/ops/content/' }}" class="text-xs font-bold text-slate-500 hover:text-slate-800">Cancel</a>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold shadow-sm transition-all">
                    Save Record
                </button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
